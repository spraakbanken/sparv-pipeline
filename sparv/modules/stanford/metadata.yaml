id: sbx-eng-namedentity-stanford
parent: stanford-parent
name:
  swe: Namnigenkänning för engelska med Stanford CoreNLP
  eng: Named entity recognition for English with Stanford CoreNLP
short_description:
  swe: Namnigenkänning (NER) med Stanford CoreNLP för engelska
  eng: Named entity recognition with Stanford CoreNLP for English
description:
  swe: |-
    Namnigenkänning (NER) gör det möjligt att märka upp namnentiteter (som t.ex. personnamn, organisationer, ortnamn) i
    texten. Stanford CoreNLP märker upp tokens med namn-entitetstyper som t.ex. PERSON, DATE, CITY etc. Notera att till
    skillnad från andra namnigenkännare som används i Sparv, lägger Stanford CoreNLP inte till strukturella annotationer
    för namn-entiteter som består av flera tokens.
  eng: |-
    Named entity recognition (NER) enables the detection of named entities (e.g. personal names, organizations,
    geographical locations) in the text. Stanford CoreNLP annotates tokens with named entity types such as PERSON, DATE,
    CITY, etc. Please note that unlike other named entity taggers used in Sparv, Stanford CoreNLP does not add
    structural annotations for multi-word named entities.

annotations:
  - <token>:stanford.ne_type
example_output: |-
  ```xml
  <token>The</token>
  <token ne_type="NATIONALITY">Swedish</token>
  <token ne_type="TITLE">chemist</token>
  <token ne_type="PERSON">Alfred</token>
  <token ne_type="PERSON">Bernhard</token>
  <token ne_type="PERSON">Nobel</token>
  <token>was</token>
  <token>born</token>
  <token>on</token>
  <token ne_type="DATE">21</token>
  <token ne_type="DATE">October</token>
  <token ne_type="DATE">1833</token>
  <token>in</token>
  <token ne_type="CITY">Stockholm</token>
  <token>.</token>
  ```
