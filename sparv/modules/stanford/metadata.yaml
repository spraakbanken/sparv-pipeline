  eng: Dependency parsing for English with Stanford CoreNLP
short_description:
  swe: Dependensparsning med Stanford CoreNLP's standardmodell för engelska
  eng: Dependency parsing with Stanford CoreNLP's standard model for English
task: dependency parsing
tagset: "[UD](https://universaldependencies.org/en/dep/)"
annotations:
