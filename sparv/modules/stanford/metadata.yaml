id: sbx-eng-tokenization-stanford
parent: stanford-parent
name:
  swe: Tokenisering med Stanford CoreNLP för engelska
  eng: Tokenization with Stanford CoreNLP for English
short_description:
  swe: Segmentering av text i token med Stanford CoreNLP för engelska
  eng: English tokenization with Stanford CoreNLP
task: tokenization
annotations:
  - stanford.token
example_extra: |-
  In order to use this annotation you need to add the following settings to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: eng

  classes:
    token: stanza.token
  ```
example_output: |-
  ```xml
  <token>Language</token>
  <token>is</token>
  <token>the</token>
  <token>human</token>
  <token>ability</token>
  <token>to</token>
  <token>acquire</token>
  <token>and</token>
  <token>use</token>
  <token>complex</token>
  <token>systems</token>
  <token>of</token>
  <token>communication</token>
  <token>.</token>
  ```
