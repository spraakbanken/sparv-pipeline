id: treetagger-parent
abstract: true
keywords:
  - treetagger
tools:
  - name: "TreeTagger"
    url: "https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/"
    license: "LicenseRef-Other"
    license_other: TreeTagger License https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/Tagger-Licence
standard_reference: "Helmut Schmid (1995): [Improvements in Part-of-Speech Tagging with an Application to German](https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/tree-tagger2.pdf). Proceedings of the ACL SIGDAT-Workshop. Dublin, Ireland."
other_references:
  - "Helmut Schmid (1994): [Probabilistic Part-of-Speech Tagging Using Decision Trees](https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/tree-tagger1.pdf). Proceedings of International Conference on New Methods in Language Processing, Manchester, UK."
created: 2014-09-16
updated: 2021-03-24
