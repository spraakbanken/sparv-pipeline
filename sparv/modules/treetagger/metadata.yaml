id: bul-treetagger-parent
abstract: true
parent: treetagger-parent
language_codes:
  - bul
models:
  - name: bulgarian.par.gz
    url: "https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/bulgarian.par.gz"
trained_on: "[Bulgarian Treebank](http://www.bultreebank.org/)"
example_extra: |-
  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: bul
  ```
---
id: sbx-bul-pos-treetagger
parent: bul-treetagger-parent
name:
  swe: Ordklasstaggning med TreeTagger för bulgariska 
  eng: Part-of-speech tagging with TreeTagger for Bulgarian
short_description:
  swe: Annotering av BTB-TS ordklasser med TreeTagger för bulgariska
  eng: Bulgarian part-of-speech annotation with BTB-TS tags by TreeTagger
task: part-of-speech tagging
tagset: "[BTB-TS](https://bultreebank.org/wp-content/uploads/2017/06/BTB-TR03.pdf)"
annotations:
  - <token>:treetagger.pos
example_output: |-
  ```xml
  <token pos="Ncmsf">Езѝкът</token>
  <token pos="Vxitf-r3s">е</token>
  <token pos="Ncfsi">система</token>
  <token pos="R">от</token>
  <token pos="Ncmpi">знаци</token>
  <token pos="R">за</token>
  <token pos="Ncnsi">кодиране</token>
  <token pos="Cp">и</token>
  <token pos="Ncnsi">декодиране</token>
  <token pos="R">на</token>
  <token pos="Ncfsi">информация</token>
  <token pos="PT_SENT">.</token>
  ```
---
id: sbx-bul-upos-treetagger
parent: bul-treetagger-parent
name:
  swe: UD-Ordklasstaggning med TreeTagger för bulgariska
  eng: UD part-of-speech tagging with TreeTagger for Bulgarian
short_description:
  swe: Annotering av UD-ordklasser (universal dependencies) för bulgariska som översätts från BTB-TS
  eng: Part-of-speech annotation with UD (universal dependency) tags for Bulgarian translated from BTB-TS
