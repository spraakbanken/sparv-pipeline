id: sbx-swe-lemmatization-sparv-saldo_dalin_swedberg_1800
language_varieties:
  - "1800"
parent: hist-parent
name:
  swe: Annotering av SALDO-grundformer för 1800-talssvenska
  eng: Annotation of SALDO citation forms (base forms, lemmas) for Swedish from the 1800s
short_description:
  swe: Fullformsuppslagning som ger SALDO-grundformer med hjälp av Dalin och Swedberg
  eng: Full-form lookup of SALDO citation forms (lemmas) using Dalin and Swedberg
task: lemmatization
keywords:
  - saldo
  - dalin
  - swedberg
annotations:
  - <token>:hist.baseform
example_output: |-
  ```xml
  <token baseform="|låda|dalinm--låda|">Lådan</token>
  <token baseform="|vara|">var</token>
  <token baseform="|hänga upp|dalinm--upphänga|">upphängd</token>
  <token baseform="|under|dalinm--under|">under</token>
  <token baseform="|den|en|">den</token>
  <token baseform="|">waggon</token>
  <token baseform="|dalinm--hvari|">hvari</token>
  <token baseform="|en|dalinm--de|">de</token>
  <token baseform="|andra|annan|">andra</token>
  <token baseform="|djur|dalinm--djur|">djuren</token>
  <token baseform="|">befunno</token>
  <token baseform="|swedbergm--sig|">sig</token>
  <token baseform="|">.</token>
  ```
example_extra: |-
  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: swe
    variety: "1800"
  ```
models:
  - name: SALDO's morphology
    url: "https://spraakbanken.gu.se/resurser/saldom"
  - name: Dalin's morphology
    url: "https://spraakbanken.gu.se/resurser/dalinm"
  - name: Swedberg's morphology
    url: "https://spraakbanken.gu.se/resurser/swedbergm"
other_references:
  - "[Borin/Forsberg/Lönngren 2013: SALDO: a touch of yin to WordNet's yang](http://dx.doi.org/10.1007/s10579-013-9233-4)"
  - '{publication 140686}'
description:
  swe: |-
    Uppslagning av grundformer för 1800-talssvenska med SALDO, Dalin och Swedberg. Kandidat-grundformer rangordnas med
    MSD-kompatibilitet (när tillgängligt), källmärks för historiska lexikon, och en Dalin/Swedberg-fallback fyller i de
    token som inte fått någon grundform.
  eng: |-
    Lookup of base forms for 19th-century Swedish using SALDO, Dalin, and Swedberg. Candidate base forms are ranked by
    MSD compatibility (when available), source-marked for historical lexicons, and a Dalin/Swedberg fallback fills
    tokens left without a base form.
---
