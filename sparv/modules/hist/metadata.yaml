id: sbx-swe-sense-sparv-saldo_dalin_swedberg_1800
language_varieties:
  - "1800"
parent: hist-parent
name:
  swe: Annotering av SALDO-identifierare för 1800-talssvenska
  eng: Annotation of SALDO identifiers for Swedish from the 1800s
short_description:
  swe: Uppslagning av SALDO-identifierare för 1800-talssvenska med stöd av Dalin och Swedberg
  eng: Lookup of SALDO identifiers for 19th-century Swedish using SALDO, with Dalin and Swedberg support for historical lookup coverage.
task: lexical lookup
keywords:
  - saldo
  - dalin
  - swedberg
annotations:
  - <token>:hist.sense
example_output: |-
  ```xml
  <token sense="|låda..1|">Lådan</token>
  <token sense="|vara..1|">var</token>
  <token sense="|hänga_upp..1|">upphängd</token>
  <token sense="|under..1|under..2|">under</token>
  <token sense="|den..2|den..1|en..2|">den</token>
  <token sense="|">waggon</token>
  <token sense="|">hvari</token>
  <token sense="|den..1|en..2|">de</token>
  <token sense="|andra..2|annan..1|">andra</token>
  <token sense="|djur..1|">djuren</token>
  <token sense="|">befunno</token>
  <token sense="|">sig</token>
  <token sense="|">.</token>
  ```
example_extra: |-
  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: swe
    variety: "1800"
  ```
models:
  - name: SALDO's morphology
    url: "https://spraakbanken.gu.se/resurser/saldom"
  - name: Dalin's morphology
    url: "https://spraakbanken.gu.se/resurser/dalinm"
  - name: Swedberg's morphology
    url: "https://spraakbanken.gu.se/resurser/swedbergm"
other_references:
  - "[Borin/Forsberg/Lönngren 2013: SALDO: a touch of yin to WordNet's yang](http://dx.doi.org/10.1007/s10579-013-9233-4)"
  - '{publication 140686}'
description:
  swe: |-
    Uppslagning av SALDO-identifierare för 1800-talssvenska där kandidater rangordnas med MSD-kompatibilitet när sådan
    information finns. Dalin och Swedberg används tillsammans med SALDO i uppslaget, men själva sense-identifierarna
    kommer från SALDO.
  eng: |-
    Lookup of SALDO identifiers for 19th-century Swedish, where candidates are ranked by MSD compatibility when
    available. Dalin and Swedberg are used together with SALDO in the lookup, but the sense identifiers themselves come
    from SALDO.
