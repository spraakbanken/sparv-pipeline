[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "sparv"
version = "5.4.0.dev0"
description = "Språkbanken's analysis platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Språkbanken", email = "sb-info@svenska.gu.se" }
]
dependencies = [
    "appdirs~=1.4",
    "argcomplete~=3.6",
    "docx2python==1.27.1",
    "jsonschema-rs==0.46.0",
    "markdown~=3.10",
    "nltk~=3.9",
    "packaging>=24.0",
    "protobuf>=3.19.0",   # Used by Stanza; see https://github.com/spraakbanken/sparv/issues/161
    "pycountry~=26.2",
    "pypdfium2~=5.6",
    "python-dateutil~=2.9",
    "python-json-logger~=4.0",
    "PyYAML~=6.0",
    "questionary==1.10.0",
    "requests>=2.32.3",
    "rich~=15.0",
    "rich-argparse~=1.7",
    "snakemake==9.19.0",
    "stanza==1.10.1",
    "torch",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
]
lint = [
    "pyright~=1.1",
    "ruff~=0.15"
]
test = [
    "pytest~=9.0",
    "pytest-sugar~=1.0"
]
docs = [
    "bs4",
    "markdown-gfm-admonition~=0.3",
    "mkdocstrings-python~=2.0",
    "pandocfilters~=1.5",
    "zensical>=0.0.33",
]

[project.urls]
Homepage = "https://github.com/spraakbanken/sparv/"
Documentation = "https://spraakbanken.gu.se/sparv/"

[project.scripts]
sparv = "sparv.__main__:cli"

[tool.uv]
required-version = ">=0.11"

[tool.uv.build-backend]
module-name = "sparv"
module-root = ""

[tool.ruff]
line-length = 120
output-format = "grouped"

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "E",      # pycodestyle: errors
    "F",      # Pyflakes
    "FA",     # flake-8-future-annotations
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ISC",    # flake8-implicit-str-concat
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "S113",   # flake8-bandit: request-without-timeout
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle: warnings
]
ignore = [
    "ANN401",  # flake8-annotations: any-type
    "B008",    # flake8-bugbear: function-call-in-default-argument
    "COM812",  # flake8-commas: missing-trailing-comma
    "E741",    # pycodestyle: ambiguous-variable-name
    "PLR09",   # Pylint: too-many-*
    "PLR1702", # Pylint: too-many-nested-blocks
    "SIM105",  # flake8-simplify: suppressible-exception
]
preview = true
allowed-confusables = ["–"]  # "Confusable" Unicode characters to ignore when enforcing RUF001, RUF002, and RUF003

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Pyflakes: unused-import

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-s -v --tb=no"
testpaths = ["tests"]
markers = [
    "slow: tests that potentially take a long time to complete",
    "swe: tests for Swedish corpora",
    "swehist: tests for corpora with historical Swedish",
    "treetagger: tests for Treetagger corpora",
    "freeling: tests for FreeLing corpora",
    "stanford: tests for Stanford Parser corpora",
    "noexternal: tests that don't rely on external tools",
    "unit: unit tests",
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["sparv", "tests"]
